name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sweety_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('server/package-lock.json', 'client/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install server dependencies
        run: npm --prefix server ci

      - name: Install client dependencies
        run: npm --prefix client ci

      - name: Run server tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/sweety_test
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/sweety_test
          JWT_SECRET: test-jwt-secret-with-at-least-thirty-two-characters-long
          APP_TIMEZONE: Asia/Kolkata
        run: npm --prefix server test

      - name: Run client tests
        run: npm --prefix client test

      - name: Build client production bundle
        run: npm --prefix client run build

